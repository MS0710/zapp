name: zapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  auto_size_text: ^3.0.0
  supabase_flutter: ^2.12.0
  logging: ^1.3.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geolocator: ^13.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  http: ^1.2.2
  http_parser: ^4.1.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/zapp_logo2.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - pubspec.yaml
  fonts:
    - family: 'word'
      fonts:
        - asset: assets/fonts/word.otf
